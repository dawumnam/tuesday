# Fixed project name: every worktree shares the same containers and volumes.
name: task-design

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: task_design
      POSTGRES_PASSWORD: task_design
      POSTGRES_DB: task_design
    ports:
      - "54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_design -d task_design"]
      interval: 2s
      timeout: 3s
      retries: 30

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 2s
      timeout: 3s
      retries: 30

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3300:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3300
      NEXTAUTH_SECRET: local-dev-secret
      SALT: local-dev-salt
      TELEMETRY_ENABLED: "false"
      # Pre-provisioned project so the app can trace without manual setup.
      LANGFUSE_INIT_ORG_ID: task-design
      LANGFUSE_INIT_ORG_NAME: task-design
      LANGFUSE_INIT_PROJECT_ID: task-design
      LANGFUSE_INIT_PROJECT_NAME: task-design
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: admin1234

  # Streamlit UI. Starts with `docker compose up`: migrates on start, seeds if
  # TD_SEED_ON_START=true. Every TD_* variable in .env reaches the app (API key,
  # routing, thresholds); the DB and Langfuse addresses below always win.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      langfuse:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      TD_DATABASE_URL: postgresql://task_design:task_design@db:5432/task_design
      TD_LANGFUSE_HOST: http://langfuse:3000
      TD_LANGFUSE_PUBLIC_KEY: pk-lf-local
      TD_LANGFUSE_SECRET_KEY: sk-lf-local
      TD_LANGFUSE_PROJECT_ID: task-design
      TD_SEED_ON_START: ${TD_SEED_ON_START:-false}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  db-data:
  langfuse-db-data:
