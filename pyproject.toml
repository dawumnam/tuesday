[project]
name = "task-design"
version = "0.1.0"
description = "과제 설계 에이전트 MVP"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
task-design = "task_design.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
